name: Build DudoHub APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Recreate DudoHub source
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/dudohub
          echo '' | base64 -d > /tmp/dudohub/project.zip
          echo '96d7e2f2d19a70f81bd3a736fb677ac34c077a73ff9952d2a4e9385294eb6cfb256: 96d7e2f2d19a70f81bd3a736fb677ac34c077a73ff9952d2a4e9385294eb6cfb'
          echo '96d7e2f2d19a70f81bd3a736fb677ac34c077a73ff9952d2a4e9385294eb6cfb  /tmp/dudohub/project.zip' | sha256sum -c -
          unzip -q /tmp/dudohub/project.zip -d /tmp/dudohub/source
          cp -a /tmp/dudohub/source/. "$GITHUB_WORKSPACE/"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.13

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DudoHub-WorldStudio-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
